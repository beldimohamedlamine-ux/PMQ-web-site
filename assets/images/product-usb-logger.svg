<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" fill="none">
  <rect width="300" height="240" fill="#F0F8F9"/>
  <!-- USB Connector (Protective translucent cap removed) -->
  <rect x="75" y="105" width="35" height="30" rx="3" fill="#A4B5B8" stroke="#5E787C" stroke-width="2"/>
  <rect x="85" y="112" width="6" height="16" rx="1" fill="#FFFFFF"/>
  <rect x="97" y="112" width="6" height="16" rx="1" fill="#FFFFFF"/>
  <!-- Main Dongle Body -->
  <rect x="105" y="80" width="135" height="80" rx="12" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3"/>
  <!-- Teal / Orange accent stripe -->
  <rect x="115" y="84" width="8" height="72" rx="4" fill="#F28C28"/>
  <!-- LCD Display -->
  <rect x="132" y="92" width="65" height="42" rx="4" fill="#A8D0C9" stroke="#0B2A30" stroke-width="1.5"/>
  <text x="178" y="122" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0B2A30" font-weight="800" text-anchor="end">22.1</text>
  <text x="187" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0B2A30" font-weight="700">°C</text>
  <text x="136" y="102" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0B2A30" font-weight="700">OK</text>
  <!-- Status LEDs & Start Key -->
  <circle cx="212" cy="102" r="5" fill="#4CC66B"/>
  <text x="222" y="105" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0B2A30" font-weight="700">OK</text>
  <circle cx="212" cy="118" r="5" fill="#E5432F"/>
  <text x="222" y="121" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0B2A30" font-weight="700">ALM</text>
  <!-- Start Button -->
  <rect x="132" y="140" width="45" height="12" rx="3" fill="#0E7C86"/>
  <text x="154" y="149" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700">START / STOP</text>
  <!-- PDF auto icon -->
  <rect x="185" y="140" width="28" height="12" rx="2" fill="#F28C28"/>
  <text x="199" y="149" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="800">PDF</text>
</svg>
