<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" fill="none">
  <rect width="300" height="240" fill="#F0F8F9"/>
  <!-- Device Body -->
  <rect x="90" y="30" width="120" height="175" rx="14" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3"/>
  <!-- Top Bezel & Logo -->
  <rect x="105" y="44" width="90" height="16" rx="3" fill="#0B2A30"/>
  <text x="150" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="700">PMQ-174H</text>
  <!-- LCD Screen -->
  <rect x="105" y="66" width="90" height="85" rx="6" fill="#A8D0C9" stroke="#0B2A30" stroke-width="2"/>
  <!-- LCD Readings -->
  <text x="114" y="86" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0B2A30" font-weight="700">TEMP</text>
  <text x="175" y="106" font-family="'JetBrains Mono', monospace" font-size="28" fill="#0B2A30" font-weight="800" text-anchor="end">21.4</text>
  <text x="188" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0B2A30" font-weight="700">°C</text>
  <line x1="110" y1="114" x2="190" y2="114" stroke="#0B2A30" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="114" y="126" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0B2A30" font-weight="700">HUMIDITY</text>
  <text x="175" y="145" font-family="'JetBrains Mono', monospace" font-size="28" fill="#0B2A30" font-weight="800" text-anchor="end">48.2</text>
  <text x="188" y="137" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0B2A30" font-weight="700">%</text>
  <!-- Buttons -->
  <circle cx="125" cy="172" r="12" fill="#F28C28"/>
  <text x="125" y="175" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="700">MIN/MAX</text>
  <circle cx="175" cy="172" r="12" fill="#0E7C86"/>
  <text x="175" y="175" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="700">SET</text>
  <!-- Vent Grille -->
  <line x1="120" y1="194" x2="180" y2="194" stroke="#CBDCDD" stroke-width="2"/>
  <line x1="125" y1="198" x2="175" y2="198" stroke="#CBDCDD" stroke-width="2"/>
</svg>
