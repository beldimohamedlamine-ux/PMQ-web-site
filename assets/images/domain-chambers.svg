  <!-- Heavy latch handle -->
  <rect x="172" y="55" width="8" height="24" rx="2" fill="#F28C28"/>
  <!-- LCD Panel on door -->
  <rect x="198" y="26" width="54" height="20" rx="3" fill="#041217"/>
  <text x="225" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#25C2D6" text-anchor="middle" font-weight="700">-80.2°C</text>
  <!-- Snowflake icon -->
