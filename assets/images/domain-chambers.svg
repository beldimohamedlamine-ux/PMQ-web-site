      <stop offset="0%" stop-color="#07202B"/>
      <stop offset="100%" stop-color="#0E3D52"/>
    </linearGradient>
  </defs>
  <rect width="320" height="120" fill="url(#bgFrz)"/>
  <!-- Laboratory Refrigerator & Ultra-low Freezer (-80°C) -->
  <rect x="50" y="15" width="85" height="92" rx="6" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2"/>
  <!-- Glass Door View -->
  <rect x="58" y="22" width="69" height="78" rx="4" fill="#CDE7ED" stroke="#4B8C9C" stroke-width="1.5"/>
  <line x1="58" y1="48" x2="127" y2="48" stroke="#4B8C9C" stroke-width="1.5"/>
  <line x1="58" y1="74" x2="127" y2="74" stroke="#4B8C9C" stroke-width="1.5"/>
